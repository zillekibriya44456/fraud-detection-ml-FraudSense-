# Context-Aware Risk Decision Policy
policy_version: "v2.0"

thresholds:
  # Base ML Probability Thresholds
  ml_high_risk: 0.85
  ml_medium_risk: 0.30

  # Contextual Escalation
  # Transactions above this amount are considered High Value and receive stricter scrutiny.
  high_value_amount: 100000.0

  # Behavioral Signal Escalation
  # If behavioral signal exceeds this, the transaction is considered anomalous.
  behavioral_anomaly_threshold: 0.50

rules:
  - id: "R1_ML_CERTAIN_FRAUD"
    description: "ML model is highly confident it is fraud."
    condition: "ml_prob >= ml_high_risk"
    decision: "BLOCK"
    level: "HIGH"

  - id: "R2_BEHAVIORAL_ANOMALY"
    description: "Transaction is highly anomalous compared to user history."
    condition: "ml_prob >= ml_medium_risk AND behavioral_signal >= behavioral_anomaly_threshold AND history_status == SUFFICIENT"
    decision: "BLOCK"
    level: "HIGH"

  - id: "R3_HIGH_VALUE_UNCERTAIN"
    description: "Transaction is medium risk but high value. Must be manually verified."
    condition: "ml_prob >= ml_medium_risk AND amount >= high_value_amount"
    decision: "VERIFY"
    level: "MEDIUM"

  - id: "R4_MEDIUM_RISK"
    description: "Transaction is medium risk. Step-up authentication requested."
    condition: "ml_prob >= ml_medium_risk"
    decision: "VERIFY"
    level: "MEDIUM"

  - id: "R5_NOMINAL"
    description: "Transaction appears safe across all signals."
    condition: "default"
    decision: "APPROVE"
    level: "LOW"
