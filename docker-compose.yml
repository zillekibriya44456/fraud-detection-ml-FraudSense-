version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DB_URL=sqlite:///./data/audit_log.db
    volumes:
      - fraud_data:/app/data

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
      - HEALTH_URL=http://api:8000/health
    depends_on:
      - api
    volumes:
      - fraud_data:/app/data

volumes:
  fraud_data:
